<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4CB45"/>
      <stop offset="100%" stop-color="#DDB63F"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#514032"/>
      <stop offset="100%" stop-color="#241B16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ballot Box -->
  <rect x="15" y="32" width="70" height="52" rx="12" fill="url(#boxGrad)" stroke="url(#logoGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Slot -->
  <rect x="32" y="38" width="36" height="5" rx="2.5" fill="#F4CB45" opacity="0.9"/>
  <!-- Ballot Paper Dropping In -->
  <path d="M 36 12 L 64 12 L 64 42 L 36 42 Z" rx="4" fill="url(#logoGrad)"/>
  <!-- Checkmark on Ballot -->
  <path d="M 43 26 L 48 31 L 57 21" stroke="#241B16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Shield Glow & Emblem -->
  <circle cx="50" cy="62" r="14" fill="#F4CB45" opacity="0.15" filter="url(#glow)"/>
  <path d="M 50 53 L 59 57 V 64 C 59 70 55 74 50 76 C 45 74 41 70 41 64 V 57 Z" fill="#2C211B" stroke="url(#logoGrad)" stroke-width="1.8"/>
  <path d="M 47 64 L 49.5 66.5 L 54 61" stroke="#F4CB45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
